# Scheduled database backup.
#
# Time Travel on the free plan keeps seven days (spec 2.5), so corruption
# noticed in week two is unrecoverable. Nobody remembers to run a backup by
# hand, which is the whole reason this file exists.
#
# A run that fails means there is no backup for that week. GitHub emails the
# owner when a scheduled workflow fails, and that notification is part of the
# backup: without it the failure is silent and the backup is imaginary
# (spec 12.2). Confirm it is switched on, under Settings -> Notifications ->
# Actions.

name: backup

on:
  schedule:
    # Sundays at 03:00 UTC, which is 11:00 in Taipei and a quiet hour either
    # way. Monthly copies come from the same job on the first of the month.
    - cron: '0 3 * * 0'
    - cron: '0 3 1 * *'
  # Available by hand, so the first run does not have to wait a week and a
  # restore drill has something recent to work from.
  workflow_dispatch:

permissions:
  contents: read
  # To read back the artifact and check how long it is actually being kept.
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide what kind of copy this is
        id: kind
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # Monthly copies are kept for a year, weekly ones for eight weeks
          # (spec 12.2). The first of the month counts as both; keeping the
          # longer one costs nothing and losing it costs a year.
          if [ "$(date -u +%d)" = "01" ]; then
            echo "name=monthly" >> "$GITHUB_OUTPUT"
            echo "retention=400" >> "$GITHUB_OUTPUT"
          else
            echo "name=weekly" >> "$GITHUB_OUTPUT"
            echo "retention=56" >> "$GITHUB_OUTPUT"
          fi

      - name: Export the deployed database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --remote is inside the script and is never omitted: the flag's
          # default is undocumented, and getting it wrong exports an empty
          # local database with no error at all (spec 12.2). The script also
          # refuses to hand over a file with no event rows in it, so a run
          # that goes green really does have records behind it.
          scripts/backup.sh --output "backup-${{ steps.kind.outputs.date }}.sql"

      - name: Keep it
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.kind.outputs.name }}-${{ steps.kind.outputs.date }}
          path: |
            backup-${{ steps.kind.outputs.date }}.sql
            backup-${{ steps.kind.outputs.date }}.counts.json
          retention-days: ${{ steps.kind.outputs.retention }}
          if-no-files-found: error

      - name: Check it is really being kept that long
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ steps.kind.outputs.retention }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          # `retention-days` is a request, not a setting. A repository has a
          # maximum of its own, and upload-artifact quietly shortens anything
          # above it to fit -- with a warning nobody reads and a green tick.
          # A monthly copy silently kept for ninety days is not a monthly
          # copy (spec 12.2). The cap is 90 days on a public repository and
          # 400 on a private one, and it is also settable per repository
          # under Settings -> Actions -> General.
          EXPIRES=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.expires_at')
          KEPT=$(( ( $(date -u -d "$EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))

          echo "Asked for $WANTED days, actually kept for about $KEPT (until $EXPIRES)."

          # A day of slack: the expiry is a timestamp and this is whole days.
          if [ "$KEPT" -lt "$(( WANTED - 1 ))" ]; then
            echo "::error::This copy will be deleted after about $KEPT days, not $WANTED." \
                 "Raise the retention limit under Settings -> Actions -> General," \
                 "and note that a public repository cannot go beyond 90 days."
            exit 1
          fi
